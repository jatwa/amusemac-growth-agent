services:
  - type: web
    name: amusemac-growth-agent
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://amusemac-growth-agent.amusemac-india.workers.dev
      - key: ADMIN_EMAIL
        value: hello@amusemacstudio.in
      - key: ZOHO_EMAIL
        value: hello@amusemacstudio.in
      - key: ZOHO_SMTP_HOST
        value: smtppro.zoho.com
      - key: ZOHO_SMTP_PORT
        value: "465"
      - key: ZOHO_SMTP_SECURE
        value: "true"
      - key: ZOHO_IMAP_HOST
        value: imappro.zoho.com
      - key: ZOHO_IMAP_PORT
        value: "993"
      - key: ZOHO_IMAP_SECURE
        value: "true"
      - key: SERPAPI_API_KEY
        value: f7b5e0e40e4e5726f6505c9e5675557975fbf3cd3af8e5b0885a8aab800be78d
      - key: WEB_SEARCH_API_KEY
        value: f7b5e0e40e4e5726f6505c9e5675557975fbf3cd3af8e5b0885a8aab800be78d
      - key: SERPAPI_PRIMARY_API_KEY
        value: f7b5e0e40e4e5726f6505c9e5675557975fbf3cd3af8e5b0885a8aab800be78d

