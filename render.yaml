services:
  - type: web
    name: amusemac-growth-agent
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://amusemac-growth-agent.amusemac-india.workers.dev
      - key: ADMIN_EMAIL
        value: hello@amusemacstudio.in
      - key: ZOHO_EMAIL
        value: hello@amusemacstudio.in
      - key: ZOHO_SMTP_HOST
        value: smtppro.zoho.com
      - key: ZOHO_SMTP_PORT
        value: "465"
      - key: ZOHO_SMTP_SECURE
        value: "true"
      - key: ZOHO_IMAP_HOST
        value: imappro.zoho.com
      - key: ZOHO_IMAP_PORT
        value: "993"
      - key: ZOHO_IMAP_SECURE
        value: "true"
      - key: SERPAPI_API_KEY
        sync: false
      - key: WEB_SEARCH_API_KEY
        sync: false
      - key: SERPAPI_PRIMARY_API_KEY
        sync: false

